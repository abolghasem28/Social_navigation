<title>Social Navigation System — Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0e17; font-family: 'JetBrains Mono', monospace; padding: 24px 16px; min-height: 100vh; }
  .container { max-width: 980px; margin: 0 auto; }
  h1 { color: #e2e8f0; font-size: 18px; font-weight: 700; text-align: center; letter-spacing: 1px; }
  .subtitle { color: #64748b; font-size: 11px; text-align: center; margin-top: 6px; }
  svg { width: 100%; margin-top: 16px; }
  svg text { user-select: none; }
  .node-group { cursor: pointer; }
  .node-group:hover rect:first-of-type { filter: brightness(1.2); }
 
  .detail-panel {
    background: #111827; border: 1px solid #1e293b; border-radius: 8px;
    padding: 16px 20px; margin-top: 12px;
  }
  .detail-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .detail-bar { width: 4px; height: 20px; border-radius: 2px; }
  .detail-title { color: #e2e8f0; font-size: 14px; font-weight: 700; }
  .detail-lines { display: flex; flex-direction: column; gap: 6px; }
  .detail-line { display: flex; gap: 8px; align-items: flex-start; }
  .detail-bullet { font-size: 11px; flex-shrink: 0; }
  .detail-text { font-size: 11.5px; line-height: 1.5; }
  .normal-bullet { color: #64748b; }
  .normal-text { color: #94a3b8; }
  .warn-bullet { color: #f59e0b; }
  .warn-text { color: #f59e0b; }
 
  .legend { display: flex; gap: 16px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend-label { color: #94a3b8; font-size: 10px; }
</style>

<script>
const nodeColors = {
  camera: '#06b6d4', yolo: '#3b82f6', ekf: '#10b981',
  gemini: '#8b5cf6', costmap: '#f59e0b', nav2: '#ef4444'
};
 
const details = {
  camera: {
    title: 'RGB-D Camera',
    content: [
      'Publishes raw RGB frames for visual analysis',
      'Mounted on robot via static TF transform',
      'Provides both color and depth streams',
    ]
  },
  yolo: {
    title: 'YOLO(Node 1)',
    content: [
      'Runs Yolo11n-pose for person bounding-box detection and extracts shoulder landmarks for robust localization',
      'Assigns persistent IDs via left-to-right spatial ordering',
      'Publishes PoseArray (3D positions) + annotated image with drawn bounding boxes & IDs',
      '⚠ Limitation: ID assignment can swap if two people cross paths closely',
    ]
  },
  ekf: {
    title: 'Kalman Filter Tracker (Identity Engine)',
    content: [
      'State vector: [x, y, vx, vy] per human',
      'Nearest-neighbor data association (5m gate) with used-tracker exclusion',
      'Process noise Q = diag(0.05, 0.05, 0.1, 0.1) — tuned for walking humans',
      'Measurement noise R = 0.5·I₂ — moderate camera trust',
      'TTL = 3.0s — tracker removed if no measurement for 3 seconds',
      'Stability report every 100 frames: compares raw vs filtered σ',
    ]
  },
  gemini: {
    title: 'Gemini Flash 2.0 (Social Reasoning)',
    content: [
      'Receives annotated RGB with bounding boxes + IDs drawn by YOLO',
      'Runs asynchronously every 2.0s in a separate thread (non-blocking)',
      'Evaluates pairwise social engagement between all human combinations',
      'Returns per-pair: engagement level, robot_can_cross probability [0–1], reason',
      'Groups of 3+ are decomposed into all C(n,2) pairs',
      'Output stored as bidirectional edges in tracker.social_edges dict',
    ]
  },
  costmap: {
    title: 'Costmap Generator (analyse_loop @ 10Hz)',
    content: [
      'Rebuilds entire PointCloud2 from scratch every 0.1s — no stale data in the node',
      'Each human → cylinder of points (r=0.25m, h=1.4m, 40 points)',
      'Blocked pairs (can_cross < 0.5) → red wall + dense obstacle points between humans',
      'Open pairs (can_cross ≥ 0.5) → green line only, NO obstacle points',
    ]
  },
  nav2: {
    title: 'Nav2 Stack (Path Planning)',
    content: [
      'Subscribes to /social_obstacles as observation source in ObstacleLayer',
      'No LiDAR — system is purely vision-based (RGB-D only)',
      'Global planner routes around marked lethal cells from social obstacle PointCloud',
      '⚠ On Lio: requires company-side access to inject social_obstacles into dynamic config generation',
    ]
  }
};
 
let current = 'ekf';
 
function select(key) {
  current = key;
  // Reset all node borders
  Object.keys(nodeColors).forEach(k => {
    const el = document.getElementById('bg-' + k);
    if (el) { el.setAttribute('stroke', '#1e293b'); el.setAttribute('stroke-width', '1'); el.setAttribute('fill', '#111827'); }
  });
  // Highlight selected
  const sel = document.getElementById('bg-' + key);
  if (sel) { sel.setAttribute('stroke', nodeColors[key]); sel.setAttribute('stroke-width', '2'); sel.setAttribute('fill', '#1a2332'); }
 
  // Update detail panel
  const d = details[key];
  document.getElementById('detail-bar').style.background = nodeColors[key];
  document.getElementById('detail-title').textContent = d.title;
  const container = document.getElementById('detail-lines');
  container.innerHTML = '';
  d.content.forEach(line => {
    const isWarn = line.startsWith('⚠');
    const div = document.createElement('div');
    div.className = 'detail-line';
    div.innerHTML = `<span class="detail-bullet ${isWarn ? 'warn-bullet' : 'normal-bullet'}">${isWarn ? '⚠' : '›'}</span><span class="detail-text ${isWarn ? 'warn-text' : 'normal-text'}">${isWarn ? line.slice(2) : line}</span>`;
    container.appendChild(div);
  });
}
 
// Init
select('ekf');
</script>
